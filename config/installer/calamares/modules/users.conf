# Calamares users module — automated user provisioning + HW AI-profile detection
# EDGE-8GB default; LOWRAM-4GB (0.6B only); WORKSTATION-16GB (4B reasoner allowed).
---
defaultGroups: [audio, video, netdev, sudo, wireshark]
autologinGroup: autologin
setRootPassword: false
doReusePassword: true
availableShells: [/bin/bash, /bin/zsh]
