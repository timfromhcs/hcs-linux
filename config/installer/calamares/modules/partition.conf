# Calamares partition module — LUKS2 full-disk encryption (AES-XTS-512) + TPM2
# Master Plan Phase 5: automatic partitioning with optional LUKS2, hardware
# profile detection (EDGE-8GB / LOWRAM-4GB / WORKSTATION-16GB).
---
enableLuksAutomatedPartitioningOptions: true
luksGeneration: luks2
luksCipher: aes-xts-plain64
luksKeySize: 512
luksHash: sha512
allowManualPartitioning: true
efiSystemPartition: "/boot/efi"
userSwapChoices: [none, file, partition]
initialSwapChoice: file
