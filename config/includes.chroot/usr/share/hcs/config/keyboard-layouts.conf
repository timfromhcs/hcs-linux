# HCS Linux — keyboard layouts (v2 plan §5 W1b)
#
# Two distinct concepts, deliberately kept apart:
#
#   1. The HCS KEY. It sits where the Windows key sits on a Windows keyboard, and
#      it does what the Windows key does — but it is called HCS. Every binding in
#      the shell, the cheatsheet and the GUI apps uses "HCS" instead of "Win".
#      Users arriving from Windows get identical muscle memory, and the docs
#      never have to explain a foreign key name.
#
#   2. The LAYOUT. Standard desktop layouts, XKB-based, switchable at runtime
#      without logging out. The default on first boot is QWERTZ (de) because the
#      project's home audience is German; en-US QWERTY is one keystroke away.
#
# The layout affects only key *positions*. It must never change the HCS key, the
# Super-based bindings, or the cheatsheet — those are layout-independent.

[meta]
hcs_key_name      = "HCS"
hcs_key_symbol    = "Super"
default_layout    = "de"
fallback_layout   = "us"
switch_shortcut   = "Super+Space"
switch_to_secondary = "Super+Alt+Space"

[layouts.de]
name        = "Deutsch (QWERTZ)"
xkb         = "de"
xkb_variant = ""
label       = "DE"
sort_index  = 0

[layouts.us]
name        = "English (QWERTY, US)"
xkb         = "us"
xkb_variant = ""
label       = "EN-US"
sort_index  = 1

[layouts.fr]
name        = "Français (AZERTY)"
xkb         = "fr"
xkb_variant = "oss"
label       = "FR"
sort_index  = 2

[layouts.es]
name        = "Español (QWERTY)"
xkb         = "es"
xkb_variant = ""
label       = "ES"
sort_index  = 3

[layouts.it]
name        = "Italiano (QWERTY)"
xkb         = "it"
xkb_variant = ""
label       = "IT"
sort_index  = 4

[layouts.gb]
name        = "English (QWERTY, UK)"
xkb         = "gb"
xkb_variant = ""
label       = "EN-GB"
sort_index  = 5

# System locales follow the *interface* language, which is a separate choice from
# the keyboard layout — a Swiss user may want a German UI with a French keyboard.
[locale]
follows_layout = true
supported      = ["de", "en", "fr", "es", "it"]

# Bindings that must never be remapped by a layout change. The HCS key is the
# navigation anchor; losing it would strand the user in a GUI with no keyboard path.
[invariants]
bindings_layout_independent = true
hcs_key_always_super = true
