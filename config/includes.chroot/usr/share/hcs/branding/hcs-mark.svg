<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hcsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Glass Hexagon -->
  <polygon points="256,40 440,146 440,366 256,472 72,366 72,146"
           fill="#111827" stroke="url(#hcsGlow)" stroke-width="12"
           stroke-linejoin="round" filter="url(#softShadow)" />

  <!-- Neural Core Connections -->
  <line x1="256" y1="120" x2="160" y2="256" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="256" y1="120" x2="352" y2="256" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="160" y1="256" x2="256" y2="392" stroke="#818cf8" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="352" y1="256" x2="256" y2="392" stroke="#818cf8" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="160" y1="256" x2="352" y2="256" stroke="#a855f7" stroke-width="6" stroke-opacity="0.8"/>

  <!-- Core Nodes -->
  <circle cx="256" cy="120" r="16" fill="#38bdf8" />
  <circle cx="160" cy="256" r="16" fill="#6366f1" />
  <circle cx="352" cy="256" r="16" fill="#6366f1" />
  <circle cx="256" cy="392" r="16" fill="#a855f7" />
  <circle cx="256" cy="256" r="22" fill="#f8fafc" stroke="#38bdf8" stroke-width="6" />
</svg>
