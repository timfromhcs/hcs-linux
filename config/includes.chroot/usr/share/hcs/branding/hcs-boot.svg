<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Boot Splash Emblem with Radial Glow Background -->
  <defs>
    <radialGradient id="bootGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bootStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bootGlow)"/>

  <polygon points="256,60 420,155 420,355 256,450 92,355 92,155"
           fill="#0f172a" stroke="url(#bootStroke)" stroke-width="12" stroke-linejoin="round" />

  <line x1="256" y1="130" x2="170" y2="255" stroke="#38bdf8" stroke-width="6"/>
  <line x1="256" y1="130" x2="342" y2="255" stroke="#38bdf8" stroke-width="6"/>
  <line x1="170" y1="255" x2="256" y2="380" stroke="#818cf8" stroke-width="6"/>
  <line x1="342" y1="255" x2="256" y2="380" stroke="#818cf8" stroke-width="6"/>
  <line x1="170" y1="255" x2="342" y2="255" stroke="#818cf8" stroke-width="6"/>

  <circle cx="256" cy="130" r="14" fill="#38bdf8" />
  <circle cx="170" cy="255" r="14" fill="#818cf8" />
  <circle cx="342" cy="255" r="14" fill="#818cf8" />
  <circle cx="256" cy="380" r="14" fill="#38bdf8" />
  <circle cx="256" cy="255" r="20" fill="#f8fafc" stroke="#38bdf8" stroke-width="6" />
</svg>
