# HCS Linux — session configuration (v2 plan §5 W1)
#
# Read by /usr/share/hcs/session/start-session.sh and by hcsd.
# Kernel-command-line parameters win over this file (see the `overrides` table),
# so a QA run can flip behaviour without editing the image.

[session]
mode            = "live"          # live | installed
desktop         = "neural-glass"  # niri + quickshell
wayland_only    = true
xwayland        = false           # GNOME 49 lesson: one display-server truth
compositor      = "niri"
shell           = "quickshell"
shell_config    = "/usr/share/hcs/shell"
autologin_user  = "hcs"
seat_manager    = "seatd"

[keyboard]
# The Windows-key position is the HCS key. Layouts are QWERTZ-first (de) because
# that is the default audience; en-US is one shortcut away. See
# /usr/share/hcs/config/keyboard-layouts.conf for the full registry.
default_layout  = "de"
available       = ["de", "us", "fr", "es", "it", "gb"]
switch_shortcut = "Super+Space"

[locale]
default  = "de"
available = ["de", "en", "fr", "es", "it"]

[display]
# Exact fractional scaling (GNOME 49 lesson: rounded factors blur text).
scale        = 1.0
scale_options = [1.0, 1.25, 1.5, 1.75, 2.0]
orientation  = "portrait"
mode         = "free"      # free = Win11-style floating | tiling = scroll columns
# niri's tiling is its default; the free mode is what Windows users expect, so it
# is what we ship. Super+Alt+T switches at runtime.
gfxmode      = "1280x800"

[budget]
idle_mb   = 6144
peak_mb   = 8192
app_mb    = 250
shell_mb  = 220

[privacy]
tor_default       = false
amnesic           = false   # Tails mode: nothing persists unless asked
recall_default    = false   # Windows Recall equivalent, local+encrypted only
screenshots_default = false

[overrides]
# Kernel cmdline key -> session.conf key. Read left to right by the bootstrap.
"hcs_private=1"  -> "privacy.tor_default=true"
"hcs_amnesic=1"  -> "privacy.amnesic=true"
"hcs_install=1"  -> "session.mode=installed"
"hcs_tiling=1"   -> "display.mode=tiling"
"hcs_console=1"  -> "session.mode=console"
