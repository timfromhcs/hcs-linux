[workspace]
members = [
    "src/hcsd",
    "src/hcs-modeld",
    "src/hcs-memory",
    "src/hcs-agents",
    "src/hcs-security",
    "src/hcs-settings",
    "src/hcs-chat",
    "src/hcs-search",
    "src/hcs-installer",
    "src/hcs-control",
    "src/hcs-updater",
    "src/hcs",
    "src/hcs-mcp",
    "src/hcs-monitor",
    "src/hcs-rag-ingest",
    "src/hcs-diagnose",
    "src/hcs-image",
    "src/hcs-ui",
    "src/hcs-gui-shots",
    # v2 additions (docs/V2_STABLE_RELEASE_MASTER_PLAN.md §4.1)
    "src/hcs-actions",
    "src/hcs-fm",
    "src/hcs-term",
    "src/hcs-shot",
    "src/hcs-notes",
    "src/hcs-update",
    "src/hcs-persist",
    "src/hcs-recall",
    "src/hcs-qa-agent",
    "src/hcs-a11y",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["timfromhcs <timfromhcs@gmail.com>", "HCS Linux Contributors"]
license = "Apache-2.0"
repository = "https://github.com/timfromhcs/hcs-linux"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
tempfile = "3.10"
