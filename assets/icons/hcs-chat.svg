  <!-- Neural synapses inside bubble -->
  <line x1="48" y1="46" x2="64" y2="38" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="64" y1="38" x2="80" y2="48" stroke="#818cf8" stroke-width="2.5" />
  <line x1="48" y1="46" x2="64" y2="60" stroke="#818cf8" stroke-width="2.5" />
  <line x1="64" y1="60" x2="80" y2="48" stroke="#c084fc" stroke-width="2.5" />
  <line x1="64" y1="38" x2="64" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" />

  <circle cx="48" cy="46" r="4.5" fill="#38bdf8" />
  <circle cx="64" cy="38" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
  <circle cx="80" cy="48" r="4.5" fill="#c084fc" />
  <circle cx="64" cy="60" r="4.5" fill="#34d399" />
