[package]
name = "hcs-ui"
description = "HCS Linux Neural Glass GUI foundation: theme, shared widgets, headless render harness"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
    "backend-winit",
    "std",
] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hcs-image = { path = "../hcs-image" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd", "html"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = { version = "1.18.1", features = ["experimental-module-builds"] }

[dev-dependencies]
tempfile.workspace = true
