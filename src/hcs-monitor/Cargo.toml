[package]
name = "hcs-monitor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hcs_monitor"
path = "src/lib.rs"

[[bin]]
name = "hcs-monitor"
path = "src/main.rs"

[dependencies]
hcs-ui = { path = "../hcs-ui" }
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
    "backend-winit",
    "std",
] }

serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

[build-dependencies]
slint-build = { version = "1.18.1", features = ["experimental-module-builds"] }
