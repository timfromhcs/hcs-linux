[package]
name = "hcs-control"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "hcs_control"
path = "src/lib.rs"

[[bin]]
name = "hcs-control"
path = "src/main.rs"

[dependencies]
hcs-settings = { path = "../hcs-settings" }
hcs-security = { path = "../hcs-security" }
hcsd = { path = "../hcsd" }
hcs-ui = { path = "../hcs-ui" }
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
    "backend-winit",
    "std",
] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[build-dependencies]
slint-build = { version = "1.18.1", features = ["experimental-module-builds"] }
