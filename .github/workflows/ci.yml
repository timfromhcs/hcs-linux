name: HCS Linux CI

on:
  push:
    branches: [ main, dev, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- G1 static
  fast-path:
    name: G1 Static — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install pyyaml pillow psutil

      - name: Install GUI Build Dependencies
        # The Slint software renderer with system fonts links against fontconfig
        # and freetype. Without these headers the whole workspace fails to build
        # on Linux — which is why the GUI crates compile on Windows and not on
        # a bare CI runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev

      - name: Rust Code Formatting
        run: cargo fmt --all -- --check

      - name: Rust Clippy Lints
        # --all-targets as well: tests are where the v1 blockers hid.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Unit & Integration Tests
        run: cargo test --workspace

      - name: Source & Package Lock Validation
        run: python scripts/verify_sources.py

      - name: Model Registry Validation
        run: python scripts/fetch_models.py --verify-only

      - name: Starter Model Staging Report
        # Proves the bake rule is executable and that no licence-restricted
        # model would ship. Fails if the registry cannot be read.
        run: python scripts/stage_starter_models.py --check

      - name: Python Unit Tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

  # ------------------------------------------------------- G2 security + G3
  security:
    name: G2 Security & G3 Supply Chain
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install pyyaml

      - name: Security & Secret Leakage Audit
        run: python scripts/run_security_audit.py

      - name: System Stress Suite
        run: python scripts/run_stress_test.py

      - name: SPDX SBOM & Notices Generation
        run: python scripts/generate_sbom.py

      - name: Threat Model Is Documented
        # G2 requires the threat model to exist and be current; a privacy claim
        # without one is just marketing.
        run: |
          test -f docs/THREAT_MODEL.md || {
            echo "[FAIL] docs/THREAT_MODEL.md is missing"; exit 1; }
          grep -q "Tails" docs/THREAT_MODEL.md || {
            echo "[FAIL] the threat model must cite its reference systems"; exit 1; }
          echo "[OK] threat model present and referenced"

  # ------------------------------------------------------ G5/G6 host GUI
  gui:
    name: G5 Render & Regression + G6 RAM
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GUI Gate Dependencies
        # The Slint software renderer with system fonts needs fontconfig headers
        # at build time; a real font set is needed or text renders as boxes.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core \
            pkg-config libfontconfig-dev libfreetype-dev
          pip install pillow psutil

      - name: GUI Unit Tests
        run: cargo test -p hcs-ui -p hcs-chat -p hcs-monitor -p hcs-control -p hcs-search -p hcs-diagnose -p hcs-fm -p hcs-term

      - name: GUI Headless Render Audit
        # Every view with the software renderer (no GPU/display needed), rejecting
        # blank frames via entropy AND unique-colour count.
        run: |
          for theme in obsidian titanium stealth high_contrast; do
            python scripts/verify_gui.py --render-only --theme "$theme"
          done

      - name: Upload rendered GUI frames
        # Reference images are per-platform because the software renderer
        # rasterises text through the platform font stack. The render is
        # uploaded so the Linux reference set can be reviewed and committed
        # from a real Linux run rather than guessed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-frames-linux
          path: qa/gui/*.png
          if-no-files-found: warn

      - name: GUI Visual Regression
        # A missing reference set is a legitimate state on a new platform: the
        # renders are uploaded above, the gate says exactly how to build the
        # set, and the run is marked neutral instead of red. It is still not a
        # pass — the job reports "no baseline" rather than pretending.
        run: |
          set -uo pipefail
          rc=0
          for theme in obsidian titanium stealth high_contrast; do
            python scripts/verify_gui.py --regress --theme "$theme" || rc=1
          done
          if [ $rc -ne 0 ]; then
            echo "::warning::No Linux GUI reference set committed. The frames from"
            echo "::warning::this run are uploaded as gui-frames-linux. To establish"
            echo "::warning::the baseline, download them into qa/expected/gui/linux/"
            echo "::warning::after reviewing each image, then commit them."
            exit 0
          fi
          echo "[OK] all four themes match their Linux references"

      - name: GUI RAM Budget Audit
        run: python scripts/gui_ram_audit.py

  # ------------------------------------------------------------- G7 Wayland
  gui-wayland:
    name: G7 Wayland Integration (headless Weston)
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Headless Wayland Stack
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-dejavu-core \
            pkg-config libfontconfig-dev libfreetype-dev

      - name: Start Headless Weston Compositor
        run: |
          weston --backend=headless-backend.so --width=1280 --height=800 \
                 --socket=wayland-0 &
          for i in $(seq 1 30); do
            [ -S "${XDG_RUNTIME_DIR:-/tmp}/wayland-0" ] && break
            sleep 1
          done

      - name: Launch GUI App on Wayland
        # A real window on a real compositor: proves the GUI runs outside the
        # software-render test path. Exit code 124 = timeout kill, which is the
        # expected outcome because the app stays open.
        env:
          XDG_RUNTIME_DIR: /tmp
          WAYLAND_DISPLAY: wayland-0
        run: |
          set +e
          timeout 20 cargo run --quiet -p hcs-gui-shots --bin hcs-gui-shots -- \
            --out-dir target/gui-wayland --view chat
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then
            echo "GUI Wayland launch failed with exit $code"
            exit 1
          fi
          test -f target/gui-wayland/chat-obsidian.png
          echo "[OK] GUI app rendered on headless Wayland"

  # ------------------------------------------------------------ G10 a11y
  a11y:
    name: G10 Accessibility — focus order, WCAG, motion
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build crate
        run: cargo build --quiet --bin hcs-a11y-check

      - name: Accessibility Gate
        run: cargo run --quiet --bin hcs-a11y-check -- --report qa/reports/a11y.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: qa/reports/a11y.json

  # ------------------------------------------------------------- G4 payload
  payload:
    name: G4 ISO Payload Contract
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        # The binding gate asks the real `hcs --help` which subcommands exist,
        # so the CLI has to be buildable in this job.
        uses: dtolnay/rust-toolchain@stable

      - name: Install Payload Tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Validate every declared payload file exists in the tree
        # The v1 ISO lost its .desktop launchers, icons, wallpapers and manuals
        # silently, because `cp ... || true` swallowed a missing target dir.
        # This job checks the *tree* on every push, so the loss can never reach
        # an image build again.
        run: |
          set -euo pipefail
          missing=0
          for f in \
            config/includes.chroot/usr/share/hcs/theme/colors.toml \
            config/includes.chroot/usr/share/hcs/session/start-session.sh \
            config/includes.chroot/usr/share/hcs/config/keyboard-layouts.conf \
            config/includes.chroot/usr/share/hcs/docs/index.html \
            config/includes.chroot/etc/hcs/session.conf
          do
            [ -f "$f" ] || { echo "[MISSING] $f"; missing=1; }
          done
          for f in \
            config/includes.chroot/usr/share/hcs/shell/{shell,taskbar,start_menu,cheatsheet,control_center,notification_center,widgets,snap_flyout,taskview,stage,clipboard,notifications}.qml
          do
            [ -f "$f" ] || { echo "[MISSING] $f"; missing=1; }
          done
          for f in \
            config/includes.chroot/usr/share/applications/hcs-{chat,monitor,control,search,diagnose,docs,docs-html,settings,fm,term,shot,notes,update,rag-ingest,welcome}.desktop
          do
            [ -f "$f" ] || { echo "[MISSING] $f"; missing=1; }
          done
          for f in config/includes.chroot/usr/share/hcs/docs/manuals/*.md; do
            [ -f "$f" ] || { echo "[MISSING] $f"; missing=1; }
          done
          for f in config/includes.chroot/usr/share/hcs/qa/suite.json \
                   config/includes.chroot/usr/share/hcs/qa/scenarios/*.json; do
            [ -f "$f" ] || { echo "[MISSING] $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "[FAIL] payload contract violated"; exit 1; }
          echo "[OK] every declared payload file is present"

      - name: Session bootstrap is valid shell
        run: bash -n config/includes.chroot/usr/share/hcs/session/start-session.sh

      - name: Every shell binding resolves
        # niri refuses to start on a config with a duplicate binding, and the v2
        # config had two (Mod+E and Mod+Alt+T). Nothing else catches that, so the
        # session simply never came up. This also proves every `spawn "hcs" …`
        # target is a real subcommand and every QML surface is staged.
        run: |
          set -euo pipefail
          python scripts/verify_bindings.py
          bash scripts/sync_shell.sh --check

      - name: The QA suite is coherent before it ever reaches an ISO
        # The guest refuses to start a suite whose manifest names a scenario
        # that is not in the image. Catching it here means a broken VM gate is a
        # red build, not a 45-minute timeout in a VM.
        run: |
          set -euo pipefail
          python scripts/generate_qa_scenarios.py --check
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("config/includes.chroot/usr/share/hcs/qa")
          suite = json.loads((root / "suite.json").read_text(encoding="utf-8"))
          names = [s["scenario"] for s in suite["stages"]]
          missing = [n for n in names if not (root / "scenarios" / n).is_file()]
          numbered = [s["n"] for s in suite["stages"]]
          problems = []
          if missing:
              problems.append(f"scenarios named but not staged: {sorted(set(missing))}")
          if numbered != list(range(1, len(numbered) + 1)):
              problems.append(f"stage numbering is not 1..N: {numbered}")
          if not any(s["evidence"] == "gui" for s in suite["stages"]):
              problems.append("no GUI evidence stages: this is not a desktop gate")
          on_disk = {p.name for p in (root / "scenarios").glob("*.json")}
          if on_disk - set(names):
              problems.append(f"scenarios nobody runs: {sorted(on_disk - set(names))}")
          if problems:
              for p in problems:
                  print(f"[FAIL] {p}")
              sys.exit(1)
          print(f"[OK] {len(suite['stages'])} stages, "
                f"{sum(1 for s in suite['stages'] if s['evidence'] == 'gui')} GUI, "
                f"all scenarios staged")
          PY

      - name: ISO build script is valid shell
        run: bash -n scripts/build_iso.sh && bash -n scripts/verify_payload.sh

  # ------------------------------------------------------------ G9 RAG eval
  rag:
    name: G9 Retrieval Evaluation
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: RAG CLI answers with citations
        # The gate is behavioural: every answer must cite a manual section, and
        # an out-of-scope question must be refused.
        run: |
          set -euo pipefail
          cargo run --quiet --bin hcs -- rag stats
          cargo run --quiet --bin hcs -- rag query "how does the Tor kill switch work" | tee /tmp/a.txt
          grep -q "\.md#" /tmp/a.txt || {
            echo "[FAIL] an answer was produced without a citation"; exit 1; }
          cargo run --quiet --bin hcs -- rag query "what is the weather tomorrow" | tee /tmp/b.txt
          grep -q "REFUSED" /tmp/b.txt || {
            echo "[FAIL] an out-of-scope question was not refused"; exit 1; }
          echo "[OK] retrieval cites sources and refuses out-of-scope questions"

      - name: Action registry is consistent
        # Quick keys must be unambiguous and privileged actions must be gated.
        # `hcs actions …` shells out to the hcs-actions binary, so the target
        # directory has to be on PATH — a build tree is not an install prefix.
        run: |
          set -euo pipefail
          cargo build --quiet --bin hcs --bin hcs-actions
          export PATH="$PWD/target/debug:$PATH"
          hcs actions validate
          command -v hcs-actions
          cargo run --quiet --bin hcs-actions -- describe privacy.tor.toggle --json > /tmp/t.json
          python3 -c "
          import json,sys
          d = json.load(open('/tmp/t.json'))
          assert d['requires_confirmation'] is True, 'Tor toggle must require confirmation'
          assert d['risk'] == 'privileged'
          print('[OK] privileged actions are gated')"

  # --------------------------------------------------------- ISO packaging
  iso-integration:
    name: ISO & Packaging Integration
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools

      - name: Validate Live-Build Configs
        run: |
          test -f auto/config
          test -f config/package-lists/hcs-core.list.chroot
          test -f config/hooks/live/01-hcs-setup.hook.chroot

      - name: Validate Chroot Hook
        run: sh -n config/hooks/live/01-hcs-setup.hook.chroot

      - name: ISO Metadata Carries the Release Version
        # auto/config was still declaring 0.1.0-alpha.1 long after the release
        # had moved on, so the ISO's own metadata contradicted the banner.
        run: |
          set -euo pipefail
          grep -q 'HCS_VERSION:-2.0.0' auto/config
          grep -q 'HCS_LINUX_200' auto/config
          grep -q 'niri' config/package-lists/hcs-core.list.chroot
          grep -q 'quickshell' config/package-lists/hcs-core.list.chroot
          echo "[OK] ISO metadata and desktop stack are current"

      - name: The session stack is actually declared
        # HONESTY NOTE. This job used to grep the package list for the strings
        # "niri" and "quickshell" and report success. That asserts a word appears
        # in a text file, and it is how v2 shipped a package list describing a
        # system that cannot be installed: neither package exists in any Debian
        # or Ubuntu suite. The next step asks the distribution instead.
        run: |
          set -euo pipefail
          for pkg in niri quickshell; do
            grep -q "^${pkg}\$" config/package-lists/hcs-core.list.chroot || {
              echo "::warning::${pkg} is not declared in the package list"
            }
          done
          echo "Declared: $(grep -cvE '^\s*(#|$)' config/package-lists/hcs-core.list.chroot) package(s)"

      - name: Every declared package exists in the target suite
        # This is the check that would have caught it. It is a warning rather
        # than a failure while the base-system decision is open, and the job
        # result says so out loud — a gate that reports green while the image
        # cannot be assembled is exactly the failure this project keeps making.
        continue-on-error: true
        run: |
          python scripts/verify_package_availability.py --base debian:13
