name: HCS Linux CI

on:
  push:
    branches: [ main, dev, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  fast-path:
    name: Fast Path Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install pyyaml

      - name: Rust Code Formatting
        run: cargo fmt --check

      - name: Rust Clippy Lints
        run: cargo clippy --workspace -- -D warnings

      - name: Rust Unit & Integration Tests
        run: cargo test --workspace

      - name: Source & Package Lock Validation
        run: python scripts/verify_sources.py

      - name: Model Registry Validation
        run: python scripts/fetch_models.py --verify-only

      - name: Python Unit Tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Security & Secret Leakage Audit
        run: python scripts/run_security_audit.py

      - name: System Stress Suite
        run: python scripts/run_stress_test.py

      - name: SPDX SBOM & Notices Generation
        run: python scripts/generate_sbom.py

  gui:
    name: GUI Render, Regression & RAM Gate
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GUI Gate Dependencies
        run: pip install pillow psutil

      - name: Install Headless Font Set
        # The Slint software renderer needs real fonts; without them text
        # renders as empty boxes.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: GUI Unit Tests
        run: cargo test -p hcs-ui -p hcs-chat -p hcs-monitor -p hcs-control -p hcs-search -p hcs-diagnose

      - name: GUI Headless Render Audit
        # Renders every view with the software renderer (no GPU/display needed)
        # and rejects blank frames via entropy + unique-colour count.
        run: |
          python scripts/verify_gui.py --render-only --theme obsidian
          python scripts/verify_gui.py --render-only --theme titanium
          python scripts/verify_gui.py --render-only --theme stealth

      - name: GUI Visual Regression
        # Diffs renders against qa/expected/gui/. A new view must be added there
        # with `python scripts/verify_gui.py --update` and the images reviewed.
        run: |
          python scripts/verify_gui.py --regress --theme obsidian
          python scripts/verify_gui.py --regress --theme titanium
          python scripts/verify_gui.py --regress --theme stealth

      - name: GUI RAM Budget Audit
        # <= 250 MB RSS per GUI app (plan §3); measures real /proc RSS.
        run: python scripts/gui_ram_audit.py

  gui-wayland:
    name: GUI Wayland Integration (headless Weston)
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Headless Wayland Stack
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-dejavu-core

      - name: Start Headless Weston Compositor
        run: |
          weston --backend=headless-backend.so --width=1280 --height=800 \
                 --socket=wayland-0 &
          for i in $(seq 1 30); do
            [ -S "${XDG_RUNTIME_DIR:-/tmp}/wayland-0" ] && break
            sleep 1
          done

      - name: Launch GUI App on Wayland
        # Real window on a real compositor: proves the GUI runs outside the
        # software-render test path. Exit code 124 = timeout kill, which is the
        # expected outcome because the app stays open.
        env:
          XDG_RUNTIME_DIR: /tmp
          WAYLAND_DISPLAY: wayland-0
        run: |
          set +e
          timeout 20 cargo run -q -p hcs-gui-shots --bin hcs-gui-shots -- \
            --out-dir target/gui-wayland --view chat
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then
            echo "GUI Wayland launch failed with exit $code"
            exit 1
          fi
          test -f target/gui-wayland/chat-obsidian.png
          echo "[OK] GUI app rendered on headless Wayland"

  iso-integration:
    name: ISO & Packaging Integration
    needs: fast-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools

      - name: Validate Live-Build Configs
        run: |
          test -f auto/config
          test -f config/package-lists/hcs-core.list.chroot
          test -f config/hooks/live/01-hcs-setup.hook.chroot
